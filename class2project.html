

<!DOCTYPE html>

<html>

<head>

<style>

.slideshow {

width: 100%;

height: 500px;

overflow: hidden;

position: relative;

}

.mySlides {

width: 100%;

height: 500px;

position: absolute;

left: 100%;

transition: left 1s ease-in-out;

}

.active {

left: 0;

}

.prev {

left: -100%;

}

</style>

</head>

<body>

<section class="slideshow">

<img class="mySlides active"

src="https://autonxt.net/wp-content/uploads/2023/08/Rolls-Royce-Droptail1-1170x702.jpg">

<img class="mySlides"

src="https://hips.hearstapps.com/mtg-prod/65c3016f6d350d000880b1cf/koenigsegg-jesko-absolut-hypercar-3.jpg?w=768&width=768&q=75&format=webp">

<img class="mySlides" src="https://www.bmw-special-sales.com/content/dam/bmw/marketBMWCOM/bmw-special-sales_com/common/protection/7-protection/bmw-css-7-series-protection-ms-new-standard.jpg" style="height:500px;">

<img class="mySlides" src="https://stimg.cardekho.com/images/carexteriorimages/930x620/Lamborghini/Revuelto/9770/1750061323804/front-left-side-47.jpg" style="height:500px;">

</section>

<script>

let index = 0;

let slides = document.getElementsByClassName("mySlides");

setInterval(() => {

slides[index].classList.remove("active");

slides[index].classList.add("prev");

index = (index + 1) % slides.length;

slides[index].classList.remove("prev");

slides[index].classList.add("active");

}, 3000);

</script>

</body>

</html>
