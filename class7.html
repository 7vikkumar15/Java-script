<!DOCTYPE html>
<html>

<head>


</head>

<body>

    <h1>JavaScript Data Types</h1>

    <p>Click the button to get a time-based greetings:</p>
    <button onclick="myfunc()"> Try it</button>
    <p id="hour"></p>
    <p id="greet"> </p>


    <h2>JS while loops</h2>
    <p id="number"></p>

    <script>
        var a = 8;
        var b = 10;
        var c = 10;
        var d = null;
        var e;
        document.write("a and b are equal :" + (a == b));
        document.write("<br>");
        document.write("c and b are equal :" + (c == b));
        document.write("<br>");
        document.write("The value of d is :" + d);
        document.write("<br>");
        document.write("The value of e is :" + e);

        //ACTIVITY 2

        function myfunc() {
            var greeting;
            var time = new Date().getHours();
            if (time < 10) {
                greeting = "Good morning";
            }
            else if (time < 20) {
                greeting = "Good day";
            }
            else {
                greeting = "Good evening";
            }
            document.getElementById("hour").innerHTML = "Current Hour is : " + time;
            document.getElementById("greet").innerHTML = greeting;

        }

        var text = "";
        var i = 0;
        while (i < 10) {
            text += "<br>The number is " + i;
            i++;

            document.getElementById("number").innerHTML = text;

        }
    </script>












</body>

</html>
